name: Owner-only personal policy changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  personal-path-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check verified GitHub author and changed paths without checking out PR code
        uses: actions/github-script@v7
        with:
          script: |
            const ownerId = 91235626;
            const pr = context.payload.pull_request;
            if (!pr) core.setFailed('Missing GitHub pull request identity');
            else {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100
              });
              const restricted = files.filter(file =>
                file.filename.startsWith('policies/personal/') ||
                file.filename.startsWith('owner-private/') ||
                file.filename.startsWith('profiles/owner-private/'));
              if (restricted.length && pr.user.id !== ownerId) {
                core.setFailed('Only the verified owner may propose changes to owner policy paths');
              } else {
                core.info('Identity/path check passed. Any proposal still requires review.');
              }
            }
