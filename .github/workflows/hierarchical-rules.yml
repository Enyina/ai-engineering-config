name: Hierarchical rule engine

on:
  pull_request:
    paths:
      - "bin/ai-rules"
      - "tests/test_hierarchy_engine.py"
      - "policies/**"
      - ".github/workflows/hierarchical-rules.yml"
  push:
    branches: [main]
    paths:
      - "bin/ai-rules"
      - "tests/test_hierarchy_engine.py"
      - "policies/**"
      - ".github/workflows/hierarchical-rules.yml"

permissions:
  contents: read

jobs:
  hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m compileall -q bin tests
      - run: python3 -m unittest discover -s tests -v
      - run: python3 bin/ai-rules validate
